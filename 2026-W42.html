<script>
(()=>{
// Scoped so nothing leaks into the window the decrypted page is written into.
const payload=JSON.parse(document.querySelector('#payload').textContent);
const form=document.querySelector('#unlock'), field=document.querySelector('#password'), button=document.querySelector('#submit'), message=document.querySelector('#message');
const decode=value=>Uint8Array.from(atob(value),c=>c.charCodeAt(0));
async function decryptPage(password, data) {
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(data.salt),iterations:data.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(data.iv),tagLength:128},key,decode(data.data));
  return new TextDecoder('utf-8',{fatal:true}).decode(plain);
}
form.addEventListener('submit',event=>{event.preventDefault();unlock(field.value,document.querySelector('#remember').checked);});
const STORE='eat-well:password';
function savedPassword(){
  try{const s=sessionStorage.getItem(STORE);if(s)return s;}catch{}
  try{const raw=localStorage.getItem(STORE);if(raw){const {password,expires}=JSON.parse(raw);if(password&&expires>Date.now())return password;localStorage.removeItem(STORE);}}catch{}
  return '';
}
function remember(password,longTerm){
  try{sessionStorage.setItem(STORE,password);}catch{}
  if(longTerm){try{localStorage.setItem(STORE,JSON.stringify({password,expires:Date.now()+30*24*3600*1000}));}catch{}}
}
function forget(){try{sessionStorage.removeItem(STORE);}catch{}try{localStorage.removeItem(STORE);}catch{}}
async function unlock(password,longTerm,auto){
  if(!globalThis.crypto?.subtle){message.textContent='浏览器无法使用解密功能，请用 Safari 打开 HTTPS 网页，或在电脑上通过 localhost 预览。';return;}
  button.disabled=true;message.textContent=auto?'正在解锁…':'正在解密…';
  try{
    const page=await decryptPage(password,payload);
    field.value='';
    remember(password,longTerm);
    document.open();document.write(page);document.close();
  }catch{
    field.value='';button.disabled=false;
    if(auto){forget();message.textContent='保存的密码已失效，请重新输入。';}
    else{message.textContent='密码不正确，或文件已损坏，请重新输入。';}
    field.focus();
  }
}
const stored=savedPassword();
if(stored)unlock(stored,false,true);
})();
</script>
