<script>
const payload=JSON.parse(document.querySelector('#payload').textContent);
const form=document.querySelector('#unlock'), field=document.querySelector('#password'), button=document.querySelector('#submit'), message=document.querySelector('#message');
const decode=value=>Uint8Array.from(atob(value),c=>c.charCodeAt(0));
async function decryptPage(password, data) {
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(data.salt),iterations:data.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(data.iv),tagLength:128},key,decode(data.data));
  return new TextDecoder('utf-8',{fatal:true}).decode(plain);
}
form.addEventListener('submit',async event=>{
  event.preventDefault();
  if(!globalThis.crypto?.subtle){message.textContent='浏览器无法使用解密功能，请用 Safari 打开 HTTPS 网页，或在电脑上通过 localhost 预览。';return;}
  button.disabled=true;message.textContent='正在解密…';
  try{
    const page=await decryptPage(field.value,payload);
    field.value='';
    document.open();document.write(page);document.close();
  }catch{
    field.value='';message.textContent='密码不正确，或文件已损坏，请重新输入。';button.disabled=false;field.focus();
  }
});
</script>
